<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Subslate browser package smoke test</title>
	</head>
	<body>
		<output id="result"></output>
		<script src="./node_modules/subslate/dist/subslate.js"></script>
		<script type="module">
			import format, { subslate } from './node_modules/subslate/dist/subslate.esm.js';

			const context = { x: 'world' };
			const classicResult = globalThis.subslate.subslate('hello ${x}', context);
			const moduleResult = format('hello ${x}', context);
			document.querySelector('#result').textContent =
				format === subslate && classicResult === moduleResult ? moduleResult : 'failed';
		</script>
	</body>
</html>
